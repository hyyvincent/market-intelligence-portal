<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Automotive Supplier Search beta dashboard for GRAMMER China Marketing.">
  <title>Automotive Supplier Search | GRAMMER China</title>
  <style>
    :root {
      --navy: #0f2433;
      --blue: #005195;
      --pale: #c4daec;
      --ink: #101820;
      --muted: #647184;
      --line: #d8e0ea;
      --bg: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header {
      background: linear-gradient(118deg, #001f38 0%, #00375f 48%, #215191 100%);
      color: #fff;
      padding: 28px 34px 24px;
    }
    .header-inner, main { width: min(1180px, calc(100% - 44px)); margin: 0 auto; }
    .brand { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .78; }
    h1 { margin: 8px 0 2px; font-size: 30px; line-height: 1.15; letter-spacing: 0; }
    .cn-title { font-size: 18px; font-weight: 750; }
    main { padding: 42px 0; }
    .status {
      min-height: 330px;
      background: linear-gradient(135deg, #b8d9eb 0%, #d7eaf4 52%, #eaf5fa 100%);
      border: 1px solid rgba(0, 81, 149, .12);
      border-radius: 8px;
      padding: 34px;
      display: grid;
      align-content: center;
      justify-items: start;
      box-shadow: 0 18px 48px rgba(0, 63, 112, .14);
    }
    .badge {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0069b8;
      color: #fff;
      font-size: 12px;
      font-weight: 850;
    }
    h2 { margin: 20px 0 8px; font-size: 26px; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); font-size: 16px; }
    a {
      display: inline-flex;
      margin-top: 28px;
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    @media (max-width: 620px) {
      header { padding: 24px 0 22px; }
      main { padding-top: 24px; }
      .status { min-height: 280px; padding: 24px; }
      h1 { font-size: 26px; }
      h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">GRAMMER China Marketing</div>
      <h1>Automotive Supplier Search</h1>
      <div class="cn-title">供应商查询</div>
    </div>
  </header>
  <main>
    <section class="status">
      <div class="badge">Beta / 测试版</div>
      <h2>Supplier intelligence workspace is being prepared.</h2>
      <p>供应商查询与筛选功能正在建设中。</p>
      <a href="../../">← Back to Market Intelligence Portal</a>
    </section>
  </main>
</body>
</html>
